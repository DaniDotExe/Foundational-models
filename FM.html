<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modelos Fundacionales — Guía Visual para Estudiantes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Newsreader:ital,opsz,wght@0,6..72,600;0,6..72,700;1,6..72,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090B10;
      --surface: #121622;
      --surface-2: #181E2E;
      --inset: #0D1018;
      --hairline: #232A3E;
      --white: #F8FAFC;
      --sec: #CBD5E1;
      --muted: #94A3B8;
      --dim: #64748B;
      --slide-accent: #14B8A6;
      --font-head: 'Newsreader', Georgia, 'Cambria', serif;
      --font-body: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', 'Courier New', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--white);
      font-family: var(--font-body);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .progress-track {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 2.5px;
      background: rgba(255,255,255,0.06);
      z-index: 200;
    }
    .progress-fill {
      height: 100%;
      width: 3.33%;
      background: var(--slide-accent);
      box-shadow: 0 0 12px var(--slide-accent);
      transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.35s ease;
    }

    .hud {
      position: fixed;
      top: 2.5px;
      left: 0;
      right: 0;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 150;
      background: rgba(9, 11, 16, 0.94);
      border-bottom: 1px solid #161B29;
    }
    .hud-left {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--slide-accent);
      font-weight: 700;
    }
    .hud-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .hud-btn {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--sec);
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.18s ease;
    }
    .hud-btn:hover { background: rgba(255,255,255,0.10); color: var(--white); }
    .hud-btn.active { border-color: var(--slide-accent); color: var(--slide-accent); background: rgba(20,184,166,0.12); }
    .step-dots { display: flex; align-items: center; gap: 4px; padding: 0 6px; }
    .step-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--hairline);
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .step-dot.done { background: var(--slide-accent); transform: scale(1.15); }
    .hud-counter {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
      padding: 0 4px;
      min-width: 54px;
      text-align: right;
    }

    /* Viewport & 1280x720 Scaled Canvas */
    .viewport {
      position: fixed;
      inset: 42.5px 0 0 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
    }

    .deck {
      position: relative;
      width: 1280px;
      height: 720px;
      transform-origin: center center;
    }

    .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.36s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .slide.active {
      opacity: 1;
      pointer-events: auto;
      z-index: 2;
    }

    .stage {
      position: relative;
      width: 1280px;
      height: 720px;
      background: var(--bg);
      overflow: hidden;
    }

    .glow-orb {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(2px);
    }

    .panel {
      position: absolute;
    }
    .panel-shadow {
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.44);
    }

    .medallion {
      position: absolute;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45);
    }

    .slide-bullets {
      list-style: disc;
      padding-left: 18px;
      margin: 0;
    }
    .slide-bullets li::marker {
      color: var(--sec);
    }

    /* Progressive Click Animations */
    body.animate-mode .anim-step {
      opacity: 0;
      will-change: opacity, transform, clip-path;
      transition:
        opacity 0.36s cubic-bezier(0.22, 1, 0.36, 1) var(--delay, 0ms),
        transform 0.38s cubic-bezier(0.22, 1, 0.36, 1) var(--delay, 0ms),
        clip-path 0.38s cubic-bezier(0.22, 1, 0.36, 1) var(--delay, 0ms);
    }
    body.animate-mode .anim-step[data-anim="wipeR"] { clip-path: inset(0 100% 0 0); transform: translateX(-8px); }
    body.animate-mode .anim-step[data-anim="wipeL"] { clip-path: inset(0 0 0 100%); transform: translateX(8px); }
    body.animate-mode .anim-step[data-anim="wipeU"] { clip-path: inset(100% 0 0 0); transform: translateY(10px); }
    body.animate-mode .anim-step[data-anim="wipeD"] { clip-path: inset(0 0 100% 0); transform: translateY(-10px); }
    body.animate-mode .anim-step[data-anim="fade"]  { transform: translateY(6px); }

    body.animate-mode .slide.active .anim-step.revealed,
    body.show-all .anim-step {
      opacity: 1 !important;
      transform: none !important;
      clip-path: inset(0 0 0 0) !important;
    }

    /* Overview Grid Modal */
    .overview-modal {
      position: fixed;
      inset: 0;
      background: rgba(9, 11, 16, 0.96);
      backdrop-filter: blur(14px);
      z-index: 300;
      padding: 36px 56px;
      overflow-y: auto;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }
    .overview-modal.open { opacity: 1; pointer-events: auto; }
    .overview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
      margin-top: 22px;
    }
    .ov-card {
      background: var(--surface);
      border-radius: 10px;
      padding: 16px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s ease;
    }
    .ov-card:hover { transform: translateY(-2px); background: var(--surface-2); }
    .ov-card.current { border-color: var(--slide-accent); background: var(--surface-2); }
    .ov-num { font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; margin-bottom: 6px; }
    .ov-title { font-family: var(--font-head); font-size: 15.5px; font-weight: 700; color: var(--white); line-height: 1.25; }

    @media print {
      @page { size: 16in 9in; margin: 0; }
      html, body { overflow: visible; height: auto; background: #090B10 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .progress-track, .hud, .overview-modal { display: none !important; }
      .viewport { position: static !important; display: block !important; inset: auto !important; }
      .deck { width: auto !important; height: auto !important; transform: none !important; }
      .slide {
        position: relative !important;
        inset: auto !important;
        opacity: 1 !important;
        pointer-events: auto !important;
        width: 16in !important;
        height: 9in !important;
        page-break-after: always;
        break-after: page;
        overflow: hidden;
      }
      .stage { transform: scale(1.2); transform-origin: top left; }
      .anim-step { opacity: 1 !important; transform: none !important; clip-path: inset(0 0 0 0) !important; }
    }
  </style>
</head>
<body class="animate-mode">

  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <nav class="hud" id="hud">
    <div class="hud-left">
      <span id="hudBlock">PORTADA</span>
      <span style="color:var(--dim);font-weight:400;" id="hudTopic">6 BLOQUES</span>
    </div>
    <div class="hud-right">
      <button class="hud-btn" onclick="toggleOverview()" title="Índice de diapositivas (G)">[G] Índice</button>
      <button class="hud-btn active" id="btnAnim" onclick="toggleShowAll()" title="Alternar animaciones progresivas / ver todo (A)">[A] Animado</button>
      <button class="hud-btn" onclick="toggleFullscreen()" title="Pantalla completa (F)">[F]</button>
      <button class="hud-btn" onclick="window.print()" title="Exportar PDF (P)">[P]</button>
      <div class="step-dots" id="stepDots"></div>
      <button class="hud-btn" onclick="stepPrev()" title="Paso o diapositiva anterior (←)">←</button>
      <button class="hud-btn" onclick="stepNext()" title="Siguiente paso o diapositiva (→ / Espacio)">→</button>
      <span class="hud-counter" id="slideCounter">01 / 42</span>
    </div>
  </nav>

  <main class="viewport" id="viewport">
    <div class="deck" id="deck"></div>
  </main>

  <div class="overview-modal" id="overviewModal">
    <div style="display:flex;align-items:center;justify-content:space-between;max-width:1280px;margin:0 auto;">
      <div>
        <div style="font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--slide-accent);letter-spacing:0.12em;">NAVEGACIÓN RÁPIDA</div>
        <h2 style="font-family:var(--font-head);font-size:28px;color:var(--white);">Índice de Diapositivas (42)</h2>
      </div>
      <button class="hud-btn" onclick="toggleOverview()">[Esc / G] Cerrar</button>
    </div>
    <div class="overview-grid" id="overviewGrid" style="max-width:1280px;margin:22px auto 0;"></div>
  </div>

  <script src="slides/slides-bundle.js"></script>
  <script>
    const SLIDE_COUNT = 42;
    let slides = [];
    let totalSlides = 0;
    let currentIndex = 0;
    let currentStep = 0;
    let showAllMode = window.location.search.includes('all=1');

    const deck = document.getElementById('deck');
    const viewport = document.getElementById('viewport');
    const progressFill = document.getElementById('progressFill');
    const slideCounter = document.getElementById('slideCounter');
    const stepDots = document.getElementById('stepDots');
    const overviewModal = document.getElementById('overviewModal');
    const overviewGrid = document.getElementById('overviewGrid');
    const btnAnim = document.getElementById('btnAnim');
    const hudBlock = document.getElementById('hudBlock');
    const hudTopic = document.getElementById('hudTopic');

    if (showAllMode) {
      document.body.classList.remove('animate-mode');
      document.body.classList.add('show-all');
      btnAnim.classList.remove('active');
      btnAnim.textContent = '[A] Todo visible';
    }

    function fitStage() {
      const rect = viewport.getBoundingClientRect();
      const scale = Math.min(rect.width / 1280, rect.height / 720);
      deck.style.transform = `scale(${scale})`;
    }

    function getSlideMaxStep(slideEl) {
      const steps = Array.from(slideEl.querySelectorAll('.anim-step')).map((el) => parseInt(el.dataset.step || '0', 10));
      return steps.length ? Math.max(...steps) : 0;
    }

    function applyReveals() {
      const s = slides[currentIndex];
      const maxStep = getSlideMaxStep(s);
      s.querySelectorAll('.anim-step').forEach((el) => {
        const st = parseInt(el.dataset.step || '0', 10);
        el.classList.toggle('revealed', showAllMode || st <= currentStep);
      });
      stepDots.innerHTML = '';
      if (maxStep > 0 && !showAllMode) {
        for (let i = 1; i <= maxStep; i++) {
          const dot = document.createElement('span');
          dot.className = 'step-dot' + (i <= currentStep ? ' done' : '');
          stepDots.appendChild(dot);
        }
      }
    }

    function goToSlide(index, initialStep = 0) {
      if (index < 0) index = 0;
      if (index >= totalSlides) index = totalSlides - 1;
      currentIndex = index;

      slides.forEach((s, idx) => s.classList.toggle('active', idx === currentIndex));
      const active = slides[currentIndex];
      const maxStep = getSlideMaxStep(active);
      currentStep = showAllMode ? maxStep : (initialStep === -1 ? maxStep : Math.min(initialStep, maxStep));

      const accent = active.dataset.accent || '#14B8A6';
      document.documentElement.style.setProperty('--slide-accent', accent);
      progressFill.style.width = `${((currentIndex + 1) / totalSlides) * 100}%`;
      slideCounter.textContent = `${String(currentIndex + 1).padStart(2, '0')} / ${String(totalSlides).padStart(2, '0')}`;
      hudBlock.textContent = active.dataset.block || '';
      hudTopic.textContent = active.dataset.topic ? '· ' + active.dataset.topic : '';

      applyReveals();
      history.replaceState(null, '', `#slide-${currentIndex + 1}`);
      overviewGrid.querySelectorAll('.ov-card').forEach((c, idx) => c.classList.toggle('current', idx === currentIndex));
    }

    function stepNext() {
      const maxStep = getSlideMaxStep(slides[currentIndex]);
      if (!showAllMode && currentStep < maxStep) {
        currentStep++;
        applyReveals();
      } else if (currentIndex < totalSlides - 1) {
        goToSlide(currentIndex + 1, 0);
      }
    }

    function stepPrev() {
      if (!showAllMode && currentStep > 0) {
        currentStep--;
        applyReveals();
      } else if (currentIndex > 0) {
        goToSlide(currentIndex - 1, -1);
      }
    }

    function toggleShowAll() {
      showAllMode = !showAllMode;
      document.body.classList.toggle('show-all', showAllMode);
      document.body.classList.toggle('animate-mode', !showAllMode);
      btnAnim.classList.toggle('active', !showAllMode);
      btnAnim.textContent = showAllMode ? '[A] Todo visible' : '[A] Animado';
      if (showAllMode) currentStep = getSlideMaxStep(slides[currentIndex]);
      applyReveals();
    }

    function toggleOverview() {
      overviewModal.classList.toggle('open');
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
      else document.exitFullscreen().catch(() => {});
    }

    function buildOverview() {
      overviewGrid.innerHTML = '';
      slides.forEach((s, idx) => {
        const card = document.createElement('div');
        card.className = 'ov-card';
        const acc = s.dataset.accent || '#14B8A6';
        card.innerHTML = `<div class="ov-num" style="color:${acc};">${String(idx + 1).padStart(2, '0')} · ${s.dataset.block || ''}</div><div class="ov-title">${s.dataset.title || ''}</div>`;
        card.onclick = () => { goToSlide(idx, 0); toggleOverview(); };
        overviewGrid.appendChild(card);
      });
    }

    viewport.addEventListener('click', (e) => {
      if (e.target.closest('button, a, .hud, .overview-modal')) return;
      stepNext();
    });

    window.addEventListener('keydown', (e) => {
      if (overviewModal.classList.contains('open')) {
        if (e.key === 'Escape' || e.key.toLowerCase() === 'g') toggleOverview();
        return;
      }
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        e.preventDefault();
        if (e.shiftKey) goToSlide(currentIndex + 1, 0);
        else stepNext();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault();
        if (e.shiftKey) goToSlide(currentIndex - 1, -1);
        else stepPrev();
      } else if (e.key === 'Home') { e.preventDefault(); goToSlide(0, 0); }
      else if (e.key === 'End') { e.preventDefault(); goToSlide(totalSlides - 1, -1); }
      else if (e.key.toLowerCase() === 'g') { e.preventDefault(); toggleOverview(); }
      else if (e.key.toLowerCase() === 'a') { e.preventDefault(); toggleShowAll(); }
      else if (e.key.toLowerCase() === 'f') { e.preventDefault(); toggleFullscreen(); }
      else if (e.key.toLowerCase() === 'p' && !e.ctrlKey && !e.metaKey) { e.preventDefault(); window.print(); }
    });

    window.addEventListener('resize', fitStage);
    window.addEventListener('load', fitStage);

    async function loadSlides() {
      let fragments = null;
      if (window.location.protocol !== 'file:') {
        try {
          const urls = Array.from({ length: SLIDE_COUNT }, (_, i) =>
            `slides/slide-${String(i + 1).padStart(2, '0')}.html`
          );
          const resps = await Promise.all(urls.map((u) => fetch(u, { cache: 'no-store' })));
          if (resps.every((r) => r.ok)) {
            fragments = await Promise.all(resps.map((r) => r.text()));
          }
        } catch (_) {}
      }
      if (!fragments && Array.isArray(window.SLIDES_BUNDLE)) {
        fragments = window.SLIDES_BUNDLE;
      }
      if (!fragments || !fragments.length) {
        deck.innerHTML = '<div style="padding:60px;color:#F8FAFC;font-family:sans-serif;">No se pudieron cargar las diapositivas desde <code>slides/</code>.</div>';
        return;
      }
      deck.innerHTML = fragments.join('\n');
      slides = Array.from(document.querySelectorAll('.slide'));
      totalSlides = slides.length;
      buildOverview();
      fitStage();
      const hashMatch = window.location.hash.match(/#slide-(\d+)/);
      goToSlide(hashMatch ? parseInt(hashMatch[1], 10) - 1 : 0, 0);
    }

    loadSlides();
  </script>
</body>
</html>
